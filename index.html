<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspección de Equipos - QR</title>
  <style>
    :root {
      --primary: #1a73e8;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --ok: #137333;
      --nok: #c5221f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 16px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2, h3 { margin-top: 0; color: #202124; }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      border-bottom: 1px dashed #eee;
      padding-bottom: 8px;
    }

    .item-check {
      border-bottom: 1px solid #f0f0f0;
      padding: 14px 0;
    }

    .item-check p {
      margin: 0 0 10px 0;
      font-weight: 500;
    }

    .options {
      display: flex;
      gap: 12px;
    }

    .options label {
      flex: 1;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
    }

    .options input[type="radio"] { display: none; }

    .options input[value="OK"]:checked + span { color: var(--ok); }
    .options input[value="NO OK"]:checked + span { color: var(--nok); }

    .options label:has(input:checked) {
      border-color: currentColor;
      background-color: rgba(0,0,0,0.03);
    }

    textarea {
      width: 100%;
      height: 70px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      padding: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:disabled { background-color: #ccc; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background: #e8f0fe;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- FICHA TÉCNICA -->
    <div class="card">
      <span class="badge" id="equipo-id">CARGANDO...</span>
      <h2 id="equipo-nombre" style="margin-top: 8px;">Cargando equipo...</h2>
      
      <div class="info-row">
        <span>Ubicación:</span>
        <strong id="equipo-ubicacion">-</strong>
      </div>
      <div class="info-row">
        <span>Estado/Vencimiento:</span>
        <strong id="equipo-vencimiento" style="color: var(--ok);">-</strong>
      </div>
    </div>

    <!-- FORMULARIO CHECKLIST -->
    <div class="card">
      <h3>Inspección Periódica</h3>
      <form id="checklist-form">
        
        <div class="item-check">
          <p>1. ¿La manguera / difusor está en buen estado?</p>
          <div class="options">
            <label><input type="radio" name="q1" value="OK" required> <span>OK</span></label>
            <label><input type="radio" name="q1" value="NO OK"> <span>NO OK</span></label>
          </div>
        </div>

        <div class="item-check">
          <p>2. ¿El manómetro indica presión en la zona verde?</p>
          <div class="options">
            <label><input type="radio" name="q2" value="OK" required> <span>OK</span></label>
            <label><input type="radio" name="q2" value="NO OK"> <span>NO OK</span></label>
          </div>
        </div>

        <div class="item-check">
          <p>3. ¿El precinto de seguridad está intacto?</p>
          <div class="options">
            <label><input type="radio" name="q3" value="OK" required> <span>OK</span></label>
            <label><input type="radio" name="q3" value="NO OK"> <span>NO OK</span></label>
          </div>
        </div>

        <div class="item-check">
          <p>Observaciones / Hallazgos:</p>
          <textarea id="observaciones" placeholder="Detalla cualquier desvío detectado..."></textarea>
        </div>

        <br>
        <button type="submit" class="btn-submit" id="btn-guardar">Completar Inspección</button>
      </form>
    </div>
  </div>

  <!-- CONFIGURACIÓN Y LÓGICA CON FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Tus credenciales configuradas
    const firebaseConfig = {
      apiKey: "AIzaSyDVfwXuRL268yxR8fUWScUZBylXcU8Gb_8",
      authDomain: "qr-extintor.firebaseapp.com",
      databaseURL: "https://qr-extintor-default-rtdb.firebaseio.com",
      projectId: "qr-extintor",
      storageBucket: "qr-extintor.firebasestorage.app",
      messagingSenderId: "631269168784",
      appId: "1:631269168784:web:5d47f1754d0849b81eaa15",
      measurementId: "G-QS4B9VPBE0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Obtener ID del extintor mediante la URL (?id=EXT-004)
    const urlParams = new URLSearchParams(window.location.search);
    const equipoId = urlParams.get('id') || 'EXT-004';

    // Cargar información del equipo desde Realtime Database
    const dbRef = ref(db);
    get(child(dbRef, `equipos/${equipoId}`)).then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        document.getElementById('equipo-id').innerText = equipoId;
        document.getElementById('equipo-nombre').innerText = data.nombre || 'Extintor';
        document.getElementById('equipo-ubicacion').innerText = data.ubicacion || 'Sin asignar';
        document.getElementById('equipo-vencimiento').innerText = data.vencimiento || 'Vigente';
      } else {
        // Datos por defecto si no se ha creado aún en la base de datos
        document.getElementById('equipo-id').innerText = equipoId;
        document.getElementById('equipo-nombre').innerText = "Extintor ABC 10kg";
        document.getElementById('equipo-ubicacion').innerText = "Sector General";
        document.getElementById('equipo-vencimiento').innerText = "Vigente (2027)";
      }
    }).catch((error) => {
      console.error(error);
    });

    // Guardar el formulario de inspección
    document.getElementById('checklist-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.innerText = "Guardando...";

      const inspeccion = {
        equipoId: equipoId,
        fecha: new Date().toISOString(),
        manguera: document.querySelector('input[name="q1"]:checked').value,
        manometro: document.querySelector('input[name="q2"]:checked').value,
        precinto: document.querySelector('input[name="q3"]:checked').value,
        observaciones: document.getElementById('observaciones').value
      };

      // Guardar registro dentro del nodo 'inspecciones' en Firebase
      push(ref(db, 'inspecciones'), inspeccion)
        .then(() => {
          alert('¡Inspección guardada exitosamente!');
          location.reload();
        })
        .catch((err) => {
          alert('Error al guardar: ' + err.message);
          btn.disabled = false;
          btn.innerText = "Completar Inspección";
        });
    });
  </script>
</body>
</html>
